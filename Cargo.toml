[workspace]
resolver = "3"
members = [
    "crates/cofre-types",
    "crates/cofre-fs",
    "crates/cofre-secret",
    "crates/cofre",
    "crates/suminuri-wire",
    "crates/suminuri-yaml",
    "crates/suminuri",
]

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/pleme-io/cofre"
repository = "https://github.com/pleme-io/cofre"
authors = ["pleme-io"]
readme = "README.md"
categories = ["cryptography", "filesystem"]
keywords = ["secrets", "sops", "akeyless", "security", "pleme-io"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
# Workspace crates
cofre-types = { path = "crates/cofre-types", version = "0.1.11" }
# The suminuri (墨塗り) crates. Declared here rather than per-member so the
# auto-release version rewrite reaches them the same way it reaches cofre-types —
# a hardcoded version in a member manifest goes stale on the next workspace bump
# and then fails to resolve, far from the edit that caused it.
suminuri-wire = { path = "crates/suminuri-wire", version = "0.1.11" }
suminuri-yaml = { path = "crates/suminuri-yaml", version = "0.1.11" }

# Pleme-io sibling-directory path deps for typed-dispatcher
# catalog integration (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = "0.1"
gen-types = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"

# Crypto / randomness
getrandom = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
blake3 = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime + HTTP (for AkeylessBackend)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util"] }

# Atomic temp files for SOPS hijack
tempfile = "3"

# Akeyless API SDK — direct HTTPS calls, no argv exposure.
#
# ── ★ NO `optional` HERE — CARGO REJECTS IT AND THE WHOLE WORKSPACE DIED ──
# `[workspace.dependencies]` entries cannot be optional; the flag belongs on the
# MEMBER's own entry, which already carries it
# (crates/cofre/Cargo.toml:31 — `{ workspace = true, optional = true }`, feeding
# the `akeyless = ["dep:akeyless-api"]` feature). Duplicating it up here is a
# hard manifest error, not a warning:
#
#   error: failed to parse manifest at `cofre/Cargo.toml`
#   Caused by: akeyless-api is optional, but workspace dependencies cannot be
#   optional
#
# MEASURED 2026-08-05: this made `cofre` unbuildable — every cargo command in
# the workspace failed at manifest parse, before any compilation. It also broke
# every repo that path-depends on it: `arch-synthesizer` -> `pangea-forge` could
# not resolve `cofre-types` at all, so the generator that emits fleet repos was
# itself unbuildable. Found only while fixing an unrelated bug in that
# generator; nothing reported it, because a manifest error surfaces as "failed
# to load source for dependency" several repos downstream of the actual cause.
akeyless-api = { version = "0.1" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
